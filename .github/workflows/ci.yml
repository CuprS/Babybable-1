name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: "Also run the HTTP integration suites against a throwaway server + MongoDB"
        type: boolean
        default: false

jobs:
  backend:
    name: Backend (lint + in-process tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: flake8 --select=E9,F63,F7,F82,F401,F811,F841 core.py models.py storage.py devdb.py run_dev.py booking_service.py workers.py seed.py server.py email_service.py routes tests_inprocess
      - name: In-process tests (no server or database needed)
        run: pytest tests_inprocess -n 2

  frontend:
    name: Frontend (types + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # eslint-plugin-expo needs ^22.13
      - run: corepack enable
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: yarn lint

  integration:
    name: Backend integration suites
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: ci_integration
      JWT_SECRET: ci-only-secret-that-is-long-enough-1234567890
      SEED_TUTOR_PASSWORD: password123
      SEED_SAMPLE_TUTORS: "true"
      ADMIN_EMAIL: admin@example.com
      ADMIN_INITIAL_PASSWORD: ci-admin-password
      EXPO_PUBLIC_BACKEND_URL: http://localhost:8001
      PUSH_ENABLED: "false"
      STORAGE_DIR: /tmp/babybabel-uploads
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Start API
        run: |
          nohup uvicorn server:app --port 8001 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8001/api/ && break; sleep 1; done
      - name: Integration tests
        # Uploads use local storage and email is off (EMAIL_PROVIDER unset), so no external services are needed.
        run: pytest tests -n 0 || (cat /tmp/api.log; exit 1)
